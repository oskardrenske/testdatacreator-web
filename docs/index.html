    <script type="py">
import json
import random
from pyscript import document, window

DATA_FILES = [
    "address_prefix",
    "address_suffix",
    "first_names",
    "last_names",
    "postadress",
    "personnummer",
]

data = {
    name: json.loads(document.getElementById(f"data-{name}").textContent)
    for name in DATA_FILES
}
last_result = []


def random_phone():
    return "0" + "".join(str(random.randint(0, 9)) for _ in range(9))


def make_person():
    return {
        "personnummer": random.choice(data["personnummer"]),
        "first_name": random.choice(data["first_names"]),
        "last_name": random.choice(data["last_names"]),
        "adress": random.choice(data["address_prefix"]) + random.choice(data["address_suffix"]),
        "gatunummer": str(random.randint(1, 150)),
        "postadress": random.choice(data["postadress"]),
        "telefonnummer": random_phone(),
    }


def generate(event=None):
    global last_result
    count_input = document.getElementById("count")
    try:
        n = int(count_input.value)
    except (ValueError, TypeError):
        n = 0
    if n < 1 or n > 1000:
        document.getElementById("status").innerText = "Ange ett antal mellan 1 och 1000."
        return
    last_result = [make_person() for _ in range(n)]
    preview = json.dumps(last_result[:20], ensure_ascii=False, indent=2)
    if n > 20:
        preview += f"\n\n… och {n - 20} till."
    document.getElementById("preview").innerText = preview
    document.getElementById("status").innerText = f"Genererade {n} personer."
    document.getElementById("download-btn").disabled = False


def download(event=None):
    if not last_result:
        return
    payload = json.dumps(last_result, ensure_ascii=False, indent=2)
    blob = window.Blob.new([payload], {"type": "application/json"})
    url = window.URL.createObjectURL(blob)
    a = document.createElement("a")
    a.href = url
    a.download = "testdata.json"
    document.body.appendChild(a)
    a.click()
    document.body.removeChild(a)
    window.URL.revokeObjectURL(url)


document.getElementById("generate-btn").disabled = False
document.getElementById("generate-btn").onclick = generate
document.getElementById("download-btn").onclick = download
document.getElementById("status").innerText = "Klart. Välj antal och klicka Generera."
    </script>
